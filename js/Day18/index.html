<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        form { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        p { margin-top: 20px; margin-bottom: 5px; font-size: 13px; color: #94a3b8; }
        a { color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Register</h2>

        <form id="registerForm">

            <input type="text" id="name" placeholder="Enter Name" required>

            <input type="email" id="email" placeholder="Enter Email" required>

            <input type="password" id="password" placeholder="Enter Password" required>

            <button type="submit">Register</button>

        </form>

        <p>Already have an account?</p>
        <a href="login.html">Login</a>
    </div>

    <script src="assests/js/index.js"></script>
</body>
</html>
