<!DOCTYPE html>
<html>
<head>
    <title>Hide Cards Example</title>
    <link rel="stylesheet" href="assests/css/style5.css">
    </head>
<body>

    <div class="card">
        <h3>Card 1</h3>
        <p>Visible Card</p>
    </div>

    <div class="card display-none">
        <h3>Card 2</h3>
        <p>display: none</p>
    </div>

    <div class="card visibility-hidden">
        <h3>Card 3</h3>
        <p>visibility: hidden</p>
    </div>

    <div class="card">
        <h3>Card 4</h3>
        <p>Visible Card</p>
    </div>

</body>
</html>
