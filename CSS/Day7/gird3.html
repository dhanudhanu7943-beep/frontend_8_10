<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product cards</title>
     <link rel="stylesheet" href="assests/css/grid3.css">
</head>
<body>
    <div class="product-container">

    <div class="card">
        <img src="https://gourban.in/cdn/shop/files/Pulse.jpg?v=1749553994&width=2048" alt="Product 1">
        <h3>Smart Watch</h3>
        <p>Rs.2,999</p>
    </div>

    <div class="card">
        <img src="https://www.portronics.com/cdn/shop/files/Portronics_Muff_M3_best_headphones_under_5000.jpg?v=1744893854" alt="Product 2">
        <h3>Headphones</h3>
        <p>Rs.1,499</p>
    </div>

    <div class="card">
        <img src="https://www.portronics.com/cdn/shop/files/Portronics_Resound_2_portable_Speaker_bluetooth.jpg?v=1736943285" alt="Product 3">
        <h3>Bluetooth Speaker</h3>
        <p>Rs.2,199</p>
    </div>

    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXv_mqP7H6ww2Wg6SrSutU1OlKJE-QeDnoQJMUDX2k4A&s=10" alt="Product 4">
        <h3>Laptop Bag</h3>
        <p>Rs.999</p>
    </div>

    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJAyrxAJWXXvr12NRE_NflFGAsiMQSPUzYlhD2xTY5PQ&s=10" alt="Product 5">
        <h3>Wireless Mouse</h3>
        <p>Rs.699</p>
    </div>

    <div class="card">
        <img src="https://media.wired.com/photos/6928c534e7dd69f52e08eeb0/master/w_1600%2Cc_limit/Tecware%2520Spectre75-2%2520source%2520henri%2520robbins.png" alt="Product 6">
        <h3>Keyboard</h3>
        <p>Rs.1,299</p>
    </div>

    <div class="card">
        <img src="https://images.philips.com/is/image/philipsconsumer/506144bc684c46e3a62fb0ce00a6d411?wid=700&hei=700&$pnglarge$" alt="Product 7">
        <h3>Power Bank</h3>
        <p>Rs.1,799</p>
    </div>

    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWE4yJ_qBt9KPL631cBHAx0dPw9hJGwk7hBzj4uqiNcw&s=10" alt="Product 8">
        <h3>USB Flash Drive</h3>
        <p>Rs.599</p>
    </div>

</div>
</body>
</html>
