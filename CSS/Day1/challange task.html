<!DOCTYPE html>
<html>
<head>
    <title>Five Colored Boxes</title>

    <style>
       
        .box{
            width: 300px;
            height: 120px;
            text-align: center;
            color: rgb(8, 8, 8);
            margin: 10px;
        }

        .box2{ background-color: rgb(240, 166, 69); }
        .box4{ background-color: rgb(226, 130, 226); }
        .box5{ background-color: rgb(241, 106, 106); }
    </style>
</head>
<body>

    
    <div style="background-color:blue; color:white; width:300px; height:120px; text-align:center;">
        <h2>Box 1</h2>
        <p>This is the first colored box.</p>
    </div>

    
    <div class="box box2">
        <h2>Box 2</h2>
        <p>This is the second colored box.</p>
    </div>

   
    <div style="background-color:orange; color:black; width:300px; height:120px; text-align:center;">
        <h2>Box 3</h2>
        <p>This is the third colored box.</p>
    </div>

    
    <div class="box box4">
        <h2>Box 4</h2>
        <p>This is the fourth colored box.</p>
    </div>

    
    <div class="box box5">
        <h2>Box 5</h2>
        <p>This is the fifth colored box.</p>
    </div>

</body>
</html>
