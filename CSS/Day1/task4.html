<!DOCTYPE html>
<html>
<head>
    <title>Departments</title>

    <style>
        .box{
            width: 250px;
            height: 50px;
            text-align: center;
            color: white;
            line-height: 50px;
            margin: 10px auto;
            font-size: 20px;
            font-weight: bold;
        }

        .cse{
            background-color: blue;
        }

        .it{
            background-color: green;
        }

        .ece{
            background-color: orange;
        }

        .eee{
            background-color: purple;
        }

        .mech{
            background-color: brown;
        }

        button{
            display: block;
            margin: 20px auto;
            width: 100px;
            height: 40px;
        }
    </style>
</head>

<body>

    <div class="box cse">CSE</div>
    <div class="box it">IT</div>
    <div class="box ece">ECE</div>
    <div class="box eee">EEE</div>
    <div class="box mech">Mechanical</div>

    <button>Apply</button>

</body>
</html>
