<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Navigation Hub &bull; New Tab</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    h1 { color: #0f172a; margin-top: 0; border-bottom: 2px solid #4f46e5; padding-bottom: 8px; }
    ol {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    li a {
      display: block;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }
    li a:hover { background: #eef2ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>External Web Portals (New Tab)</h1>
    <main>
      <ol>
        <li><a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google Search Engine</a></li>
        <li><a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">Facebook Social Network</a></li>
        <li><a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">Instagram Photo Sharing</a></li>
        <li><a href="https://www.amazon.in" target="_blank" rel="noopener noreferrer">Amazon Online Shopping</a></li>
        <li><a href="https://www.flipkart.com" target="_blank" rel="noopener noreferrer">Flipkart E-Commerce</a></li>
      </ol>
    </main>
  </div>
</body>
</html>
