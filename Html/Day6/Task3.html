<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Card</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .profile-card {
      max-width: 360px;
      width: 100%;
      background: #ffffff;
      padding: 28px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    h1 { font-size: 20px; color: #0f172a; margin-top: 0; }
    img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin: 12px auto;
      border: 4px solid #6366f1;
    }
    .info {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      text-align: left;
      font-size: 14px;
    }
    .info p { margin: 6px 0; }
  </style>
</head>
<body>
  <div class="profile-card">
    <h1>Student Identification Card</h1>
    <main>
      <img src="hedi.jpg" alt="Student Photograph">
      <div class="info">
        <p><strong>Name:</strong> Heidi</p>
        <p><strong>Course:</strong> Full Stack Development</p>
        <p><strong>Mobile:</strong> 8967453211</p>
      </div>
    </main>
  </div>
</body>
</html>
