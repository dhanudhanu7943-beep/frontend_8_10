<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four-Category Image Showcase</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 840px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    h1 { color: #0f172a; margin-top: 0; border-bottom: 2px solid #10b981; padding-bottom: 8px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 10px;
    }
    .item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .item h3 { margin: 10px 0 4px; font-size: 15px; color: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Categorized Image Gallery</h1>
    <main class="grid">
      <div class="item">
        <img src="nature.jpg" alt="Nature Landscape">
        <h3>Nature</h3>
      </div>
      <div class="item">
        <img src="thar.jpg" alt="Mahindra Thar Car">
        <h3>Car (Thar)</h3>
      </div>
      <div class="item">
        <img src="bike.jpg" alt="Sports Motorcycle">
        <h3>Bike</h3>
      </div>
      <div class="item">
        <img src="mobile.jpg" alt="Mobile Smartphone">
        <h3>Mobile</h3>
      </div>
    </main>
  </div>
</body>
</html>
