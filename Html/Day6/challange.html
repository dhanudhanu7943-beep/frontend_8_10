<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Challenge &bull; Media &amp; Hyperlinks</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    h1 { color: #0f172a; margin-top: 0; border-bottom: 2px solid #6366f1; padding-bottom: 8px; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 12px;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .card h3 { margin: 12px 0 4px; font-size: 16px; color: #334155; }
    ol {
      background: #f1f5f9;
      padding: 16px 20px 16px 36px;
      border-radius: 8px;
    }
    ol a { color: #4f46e5; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Assignment Challenge: Media &amp; Hyperlinks</h1>

    <main>
      <div class="gallery-grid">
        <div class="card">
          <img src="actor.jpg" alt="Actor image">
          <h3>Actor Image</h3>
        </div>
        <div class="card">
          <img src="paris.jpg" alt="Paris landmark">
          <h3>Paris Landmark</h3>
        </div>
        <div class="card">
          <img src="food.jpg" alt="Delicious Food">
          <h3>Food Image</h3>
        </div>
      </div>

      <h2>Uploaded External Links</h2>
      <ol>
        <li><a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google Search Engine</a></li>
        <li><a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">YouTube Video Platform</a></li> 
      </ol>
    </main>
  </div>
</body>
</html>
