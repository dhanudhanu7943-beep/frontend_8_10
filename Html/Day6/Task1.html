<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Useful Web Resources Directory</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    h1 { color: #0f172a; margin-top: 0; border-bottom: 2px solid #0284c7; padding-bottom: 8px; }
    ol {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    li a {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    li a:hover {
      background: #e0f2fe;
      transform: translateX(4px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Useful Developer Websites</h1>
    <main>
      <ol>
        <li><a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google Search</a></li>
        <li><a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">YouTube Video Tutorials</a></li> 
        <li><a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub Repository Hub</a></li>
      </ol>
    </main>
  </div>
</body>
</html>
