<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Dhanalakshmi</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .profile-card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      padding: 32px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      text-align: center;
    }
    .avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      font-size: 32px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 24px;
      color: #0f172a;
      margin: 0 0 4px;
    }
    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .info-list {
      text-align: left;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 20px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #64748b;
      font-weight: 500;
    }
    .info-value {
      color: #0f172a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar">D</div>
    <h1>Dhanalakshmi A</h1>
    <div class="subtitle">Frontend &amp; Full-Stack Student Developer</div>
    
    <div class="info-list">
      <div class="info-item">
        <span class="info-label">Name:</span>
        <span class="info-value">Dhanalakshmi A</span>
      </div>
      <div class="info-item">
        <span class="info-label">Age:</span>
        <span class="info-value">21</span>
      </div>
      <div class="info-item">
        <span class="info-label">Qualification:</span>
        <span class="info-value">B.Sc Computer Science</span>
      </div>
      <div class="info-item">
        <span class="info-label">Location:</span>
        <span class="info-value">Velachery, Chennai</span>
      </div>
    </div>
  </div>
</body>
</html>
