<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Native Video Player</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .player-card {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      text-align: center;
    }
    h1 { color: #0f172a; margin-top: 0; font-size: 22px; }
    video {
      width: 100%;
      height: auto;
      max-height: 380px;
      border-radius: 10px;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <h1>HTML5 Video Player</h1>
    <video controls>
      <source src="assests/video/Video .mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</body>
</html>
