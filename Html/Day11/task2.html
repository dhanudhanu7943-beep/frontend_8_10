<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Native Audio Player</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 75vh;
    }
    .player-card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      text-align: center;
    }
    h1 { color: #0f172a; margin-top: 0; font-size: 22px; }
    audio { width: 100%; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="player-card">
    <h1>HTML5 Native Audio Player</h1>
    <p>Playing audio track with native browser controls:</p>
    <audio controls>
      <source src="assests/audio/Audio.mpeg" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>
</body>
</html>
