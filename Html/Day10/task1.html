<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Document Structure Demonstration</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    h1 { color: #0f172a; margin-top: 0; }
    h2 { color: #4338ca; }
    hr { border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HTML5 Document Structure</h1>
    <h2>Welcome to HTML5!</h2>
    <hr>
    <p>HTML5 is the latest standard version of HTML used to create modern, semantic web pages.</p>
    <p>This webpage demonstrates the official, valid HTML5 document structure with doctype declaration, charset encoding, and viewport configuration.</p>
  </div>
</body>
</html>
