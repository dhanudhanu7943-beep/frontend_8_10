<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form details</title>
</head>
<body>
    
    <h2>Registration Form Details</h2>
    <div>
        <form>
        <label >Enter the Name:</label>
        <input type="text"  placeholder="Enter name" >
        <br><br>
         <label >Enter the Age:</label>
        <input type="text" placeholder="Age" >
        <br><br>
        <label >password:</label>
        <input type="password" password="password"  >
        <br>
        <br>
         <label >Mobile No:</label>
        <input type="text" placeholder="Mobile no" >
        <br><br>
         <label >Enter a email:</label>
        <input type="text" placeholder="email" >
        <br><br>
        <label >Enter a DOB:</label>
        <input type="datetime-local">
        <br><br>
        <label>Gender:</label>
         <input type="radio" name="Gender">Male
         <input type="radio" name="Gender">Female
         <br><br>
         <label>Course:</label><br>
        <select >
            <option>Select Position</option>
            <option>Software Developer</option>
            <option>Web Designer</option>
            <option>UI/UX Designer</option>
            <option>Data Analyst</option>
        </select><br><br>
            <br><br>
            <label>Address:</label><br>
            <textarea rows="4" cols="30" placeholder="Enter your address"></textarea><br><br>

             <input type="submit" value="Register">

         </form>
    </div>
   
</body>
</html>
