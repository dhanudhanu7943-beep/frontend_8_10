<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <form>
        <label>Full Name:</label><br>
        <input type="text" name="fullname" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter your phone number"><br><br>

        <label>Position Applied For:</label><br>
        <select>
            <option>Select Position</option>
            <option>Software Developer</option>
            <option>Web Designer</option>
            <option>UI/UX Designer</option>
            <option>Data Analyst</option>
        </select><br><br>

        <label>Years of Experience:</label><br>
        <input type="number" name="experience" min="0"><br><br>
        <label>Upload Resume:</label><br>
        <input type="file" name="resume"><br><br>

        <label>Cover Letter:</label><br>
        <textarea ></textarea><br><br>

        <input type="submit" value="Apply Now">
    </form>
</body>
</html>
