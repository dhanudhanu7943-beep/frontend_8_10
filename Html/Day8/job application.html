<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .form-card {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    h1 { color: #0f172a; margin-top: 0; font-size: 22px; border-bottom: 2px solid #0284c7; padding-bottom: 8px; }
    label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      margin-bottom: 12px;
    }
    input[type="submit"] {
      width: 100%;
      background: #0284c7;
      color: white;
      font-weight: 600;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h1>Job Application Form</h1>
    <form onsubmit="event.preventDefault(); alert('Application submitted successfully!');">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>

      <label for="position">Position Applied For:</label>
      <select id="position" name="position" required>
        <option value="">-- Select Position --</option>
        <option>Software Developer</option>
        <option>Web Designer</option>
        <option>UI/UX Designer</option>
        <option>Data Analyst</option>
      </select>

      <label for="experience">Years of Experience:</label>
      <input type="number" id="experience" name="experience" min="0" max="40" placeholder="0" required>

      <label for="resume">Upload Resume (PDF/Docx):</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">

      <label for="coverletter">Cover Letter:</label>
      <textarea id="coverletter" name="coverletter" rows="3" placeholder="Briefly describe why you are a good fit..."></textarea>

      <input type="submit" value="Apply Now">
    </form>
  </div>
</body>
</html>
