<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us Form</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      padding: 24px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .form-card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    h1 { color: #0f172a; margin-top: 0; font-size: 22px; border-bottom: 2px solid #4f46e5; padding-bottom: 8px; }
    label { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 4px; display: block; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 14px;
    }
    input[type="submit"] {
      background: #4f46e5;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h1>Contact Form</h1>
    <form onsubmit="event.preventDefault(); alert('Message Sent Successfully!');">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>

      <label for="phone">Mobile Number:</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit mobile" required>

      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" placeholder="Enter subject" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4" placeholder="Enter your message here..." required></textarea>

      <input type="submit" value="Send Message">
    </form>
  </div>
</body>
</html>
