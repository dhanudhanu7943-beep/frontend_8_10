<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>
<body>
    <h1>Contact Form</h1>
    <form>
         <label>Full Name:</label><br>
        <input type="text" name="fullname" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="Password" placeholder="Password"><br><br>

        <label>Mobile No:</label><br>
        <input type="mobile no" name="mobile no" placeholder="mobile no"><br><br>


        <label>Subject:</label><br>
        <input type="text" name="subject" placeholder="Enter subject"><br><br>

        <label>Message:</label><br>
        <textarea rows="5" cols="30" placeholder="Enter your message"></textarea><br><br>

        <input type="submit" value="Send Message">
    </form>
</body>
</html>
